name: Deploy BuildFit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run css:build
      - run: dotnet restore BuildFit.slnx
      - run: dotnet test BuildFit.slnx --configuration Release --no-restore
      - run: dotnet workload install wasm-tools
      - run: dotnet publish src/BuildFit.Web/BuildFit.Web.csproj --configuration Release --no-restore --output publish
      - name: Prepare project-site paths
        shell: bash
        run: |
          sed -i 's#<base href="/" />#<base href="/buildfit/" />#' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
